# Define how many simultaneous connections each worker process can handle.
events
{
    worker_connections 1024;
}

# The main configuration for handling HTTP/HTTPS traffic.
http
{
    # Include the list of standard file types (like .html, .css, .jpg).
    include /etc/nginx/mime.types;
    # Default type if a file's extension isn't recognized.
    default_type application/octet-stream;

    # Define a virtual server block.
    server
    {
        # Listen on port 443 (HTTPS) for both IPv4 and IPv6 connections.
        # The 'ssl' parameter enables encryption.
        listen 443 ssl;
        listen [::]:443 ssl;

        # The domain name this server responds to.
        server_name abessa-m.42.fr;

        # Specify which versions of the TLS protocol are allowed (1.2 and 1.3 are secure).
        ssl_protocols TLSv1.2 TLSv1.3;
        # Provide the paths to the certificate and private key we generated in the Dockerfile.
        ssl_certificate /etc/nginx/ssl/inception.crt;
        ssl_certificate_key /etc/nginx/ssl/inception.key;

        # The root directory where our website files are stored inside the container.
        root /var/www/html;
        # The default file to serve if the user doesn't specify one (e.g., browsing to /).
        index index.html;

        # How to handle requests for any path (represented by '/').
        location /
        {
            # Try to find a file ($uri) or a directory ($uri/) matching the request.
            # If nothing is found, return a 404 (Not Found) error.
            try_files $uri $uri/ =404;
        }
    }
}
