services:
  mariadb:
    build: ./requirements/mariadb
    image: mariadb
    container_name: mariadb
    restart: unless-stopped
    env_file: .env
    volumes:
      - ${DATA_PATH}/mariadb:/var/lib/mysql
    networks:
      - inception
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  wordpress:
    build: ./requirements/wordpress
    image: wordpress
    container_name: wordpress
    restart: unless-stopped
    env_file: .env
    volumes:
      - ${DATA_PATH}/wordpress:/var/www/html
    networks:
      - inception
    healthcheck:
      test: ["CMD-SHELL", "php-fpm83 -t"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      mariadb:
        condition: service_healthy

  nginx:
    build: ./requirements/nginx
    image: nginx
    container_name: nginx
    restart: unless-stopped
    ports:
      - "443:443"
    env_file: .env
    volumes:
      - ${DATA_PATH}/wordpress:/var/www/html
    networks:
      - inception
    depends_on:
      wordpress:
        condition: service_healthy

  adminer:
    build: ./requirements/adminer
    image: adminer
    container_name: adminer
    restart: unless-stopped
    ports:
      - "8084:80"
    env_file: .env
    networks:
      - inception
    depends_on:
      - mariadb

networks:
  inception:
    driver: bridge
